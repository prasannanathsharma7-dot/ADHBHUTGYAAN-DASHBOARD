name: Scheduled Scraper Run

# Runs the scraper on a schedule so you don't need to manage Celery/Redis
# yourself. Each run is a single ephemeral job — good for steady, small
# incremental scraping (a few hundred/thousand comments per run) rather
# than the full 1M-comment initial load, which should be run once
# manually from a machine with a proper Redis broker + proxy pool
# (see scraper/youtube_worker.py + ARCHITECTURE.md).

on:
  schedule:
    # Runs every day at 03:00 UTC (~8:30 AM IST). Adjust as needed.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python scraper/run_scheduled.py

  enrich:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Claude Batch enrichment
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python nlp/batch_pipeline.py
